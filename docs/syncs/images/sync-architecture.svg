<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#383838"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ED7D2B"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="399" rx="10" fill="#FFFFFF" stroke="#E3E3E3"/>

  <!-- Systems -->
  <rect x="30" y="86" width="190" height="84" rx="6" fill="#EEF0F3" stroke="#C5CAD1" stroke-width="1.5"/>
  <text x="125" y="122" fill="#383838" font-size="13px" font-weight="bold" text-anchor="middle">System A</text>
  <text x="125" y="141" fill="#6B6B6B" font-size="10px" text-anchor="middle">an app, e.g. webshop</text>
  <text x="125" y="156" fill="#999" font-size="9px" text-anchor="middle">or read from its pipeline table</text>

  <rect x="780" y="86" width="190" height="84" rx="6" fill="#EEF0F3" stroke="#C5CAD1" stroke-width="1.5"/>
  <text x="875" y="122" fill="#383838" font-size="13px" font-weight="bold" text-anchor="middle">System B</text>
  <text x="875" y="141" fill="#6B6B6B" font-size="10px" text-anchor="middle">an app, e.g. ERP</text>
  <text x="875" y="156" fill="#999" font-size="9px" text-anchor="middle">or read from its pipeline table</text>

  <!-- Worker -->
  <text x="370" y="62" fill="#ED7D2B" font-size="12px" font-weight="bold">RUNS IN PELIQAN</text>
  <rect x="370" y="72" width="260" height="112" rx="8" fill="#FCEFE3" stroke="#ED7D2B" stroke-width="2"/>
  <text x="500" y="108" fill="#383838" font-size="14px" font-weight="bold" text-anchor="middle">Sync worker</text>
  <text x="500" y="128" fill="#6B6B6B" font-size="10px" text-anchor="middle">one data app per system pair</text>
  <text x="500" y="144" fill="#6B6B6B" font-size="10px" text-anchor="middle">all syncs between A and B</text>
  <text x="500" y="160" fill="#6B6B6B" font-size="10px" text-anchor="middle">scheduled, e.g. every 5–15 minutes</text>

  <!-- A side -->
  <path d="M220,112 H366" stroke="#383838" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="293" y="104" fill="#555" font-size="10px" text-anchor="middle">reads changes</text>
  <path d="M370,146 H224" stroke="#ED7D2B" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="297" y="164" fill="#C8631A" font-size="10px" text-anchor="middle">writes back</text>

  <!-- B side -->
  <path d="M780,112 H634" stroke="#383838" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="707" y="104" fill="#555" font-size="10px" text-anchor="middle">reads changes</text>
  <path d="M630,146 H776" stroke="#ED7D2B" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="703" y="164" fill="#C8631A" font-size="10px" text-anchor="middle">writes back</text>

  <text x="293" y="196" fill="#999" font-size="9px" text-anchor="middle">through its API,</text>
  <text x="293" y="208" fill="#999" font-size="9px" text-anchor="middle">via its Peliqan connection</text>
  <text x="707" y="196" fill="#999" font-size="9px" text-anchor="middle">through its API,</text>
  <text x="707" y="208" fill="#999" font-size="9px" text-anchor="middle">via its Peliqan connection</text>

  <!-- Warehouse -->
  <path d="M500,188 V246" stroke="#383838" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="510" y="222" fill="#555" font-size="10px">lookups · link rows · run log</text>

  <text x="300" y="242" fill="#383838" font-size="12px" font-weight="bold">PELIQAN DATA WAREHOUSE</text>
  <rect x="300" y="250" width="400" height="76" rx="8" fill="#FFFFFF" stroke="#383838" stroke-width="1.5"/>
  <text x="500" y="276" fill="#383838" font-size="12px" font-weight="bold" text-anchor="middle">Worker state</text>
  <text x="500" y="294" fill="#6B6B6B" font-size="10px" text-anchor="middle">link table · run log · views · audit findings</text>
  <text x="500" y="310" fill="#6B6B6B" font-size="10px" text-anchor="middle">plain tables: query them, chart them, alert on them</text>

  <text x="500" y="350" fill="#555" font-size="10px" text-anchor="middle">Reads come from the app’s API, or from its Peliqan pipeline table; writes always go to the other app.</text>
  <text x="500" y="364" fill="#555" font-size="10px" text-anchor="middle">Nothing has to be loaded first: the warehouse holds the worker’s state, and audit findings when you ask for an audit.</text>

  <!-- Legend -->
  <path d="M30,376 H970" stroke="#E3E3E3"/>
  <rect x="30" y="383" width="10" height="10" rx="2" fill="#FCEFE3" stroke="#ED7D2B"/><text x="46" y="392" fill="#555" font-size="10px">runs in Peliqan</text>
  <rect x="190" y="383" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#383838"/><text x="206" y="392" fill="#555" font-size="10px">data in the warehouse</text>
  <rect x="380" y="383" width="10" height="10" rx="2" fill="#EEF0F3" stroke="#C5CAD1"/><text x="396" y="392" fill="#555" font-size="10px">external system</text>
  <path d="M540,388 H570" stroke="#383838" stroke-width="1.5"/><text x="578" y="392" fill="#555" font-size="10px">read</text>
  <path d="M640,388 H670" stroke="#ED7D2B" stroke-width="1.8"/><text x="678" y="392" fill="#555" font-size="10px">write back</text>
</svg>
